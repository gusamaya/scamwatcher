<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · ScamWatcher</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            color: #111827;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 28px 24px;
            box-shadow: 0 8px 24px rgba(15, 45, 92, 0.08);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }
        .brand img { width: 44px; height: 44px; object-fit: contain; }
        .brand h1 { margin: 0; font-size: 20px; color: #0f2d5c; }
        .brand p { margin: 2px 0 0; font-size: 13px; color: #6b7280; }
        label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 11px 12px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }
        input:focus { outline: 2px solid #1d4ed8; outline-offset: 1px; border-color: #1d4ed8; }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            background: #0f2d5c;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #0f4c8a; }
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="ScamWatcher logo">
            <div>
                <h1>ScamWatcher</h1>
                <p>Advisory Dashboard</p>
            </div>
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
